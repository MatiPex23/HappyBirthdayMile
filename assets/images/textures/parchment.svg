<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <defs>
    <radialGradient id="parchmentBase" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#fffdfa"/>
      <stop offset="60%" stop-color="#faf2e4"/>
      <stop offset="90%" stop-color="#f2e3cb"/>
      <stop offset="100%" stop-color="#e3cbab"/>
    </radialGradient>
    <filter id="noiseFilter">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.85  0 0 0 0 0.75  0 0 0 0 0.6  0 0 0 0.12 0"/>
      <feBlend in="SourceGraphic" in2="noise" mode="multiply"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#parchmentBase)"/>
  <rect width="100%" height="100%" filter="url(#noiseFilter)" opacity="0.4"/>
</svg>
